# Skill-script tests for the public plugin tree.

name: ai-plugin-devtoolbox

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test
        run: |
          python3 -m unittest discover -s tests -p '*_test.py'
          node --test scripts/*.test.mjs
